<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011612" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Golden Millet Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="neuralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Bevel Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#10B981" stroke-width="3" stroke-opacity="0.35" />

  <!-- Soil / Landscape Furrows Arc (Ancient Thinai Landscape) -->
  <path d="M 96 390 C 180 430, 332 430, 416 390" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M 128 418 C 196 448, 316 448, 384 418" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" />

  <!-- Central Stem (Nature + Tech Highway) -->
  <path d="M 256 410 Q 256 270, 256 120" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" />

  <!-- Left Side: Agronomic Leaf (Vitality & Photosynthesis) -->
  <path d="M 256 310 C 160 300, 120 220, 130 150 C 190 140, 250 200, 256 250 Z" 
        fill="url(#leafGrad)" />

  <!-- Leaf Vein Circuit Lines (AI on the Edge) -->
  <path d="M 175 195 L 220 225" fill="none" stroke="#ECFDF5" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 155 240 L 235 255" fill="none" stroke="#ECFDF5" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="175" cy="195" r="4" fill="#34D399" filter="url(#neuralGlow)" />
  <circle cx="155" cy="240" r="4" fill="#34D399" filter="url(#neuralGlow)" />

  <!-- Right Side: Golden Millet / Grain Grains (Indigenous Thinai Harvest) -->
  <!-- Grain 1 -->
  <ellipse cx="295" cy="165" rx="18" ry="32" transform="rotate(35 295 165)" fill="url(#goldGrad)" />
  <!-- Grain 2 -->
  <ellipse cx="320" cy="225" rx="18" ry="32" transform="rotate(45 320 225)" fill="url(#goldGrad)" />
  <!-- Grain 3 -->
  <ellipse cx="300" cy="285" rx="18" ry="32" transform="rotate(40 300 285)" fill="url(#goldGrad)" />

  <!-- Neural Synapse Nodes on Grain Stems -->
  <path d="M 256 200 L 285 185" fill="none" stroke="#FCD34D" stroke-width="3" stroke-dasharray="2 3" />
  <path d="M 256 255 L 305 240" fill="none" stroke="#FCD34D" stroke-width="3" stroke-dasharray="2 3" />
  <path d="M 256 305 L 285 295" fill="none" stroke="#FCD34D" stroke-width="3" stroke-dasharray="2 3" />

  <circle cx="285" cy="185" r="3.5" fill="#FCD34D" />
  <circle cx="305" cy="240" r="3.5" fill="#FCD34D" />
  <circle cx="285" cy="295" r="3.5" fill="#FCD34D" />

  <!-- Crown Apex Spark / Beacon (Intelligence Core) -->
  <circle cx="256" cy="118" r="9" fill="#FCD34D" filter="url(#neuralGlow)" />
  <circle cx="256" cy="118" r="4" fill="#FFFFFF" />
</svg>
